# 蓝队业务管理系统 · Nginx：静态资源托管 + API/WebSocket 反向代理（HTTPS）
# 自签证书由 deploy/deploy.sh 生成于 deploy/certs，挂载到 /etc/nginx/certs。
# 正式环境请替换为受信任证书（保持挂载路径不变）。
# 80 端口仅做 301 跳转，业务一律走 443。

# ---- Web 渗透防护 · 全局硬化（http 级）----
server_tokens off;              # 隐藏 nginx 版本号（防指纹识别）

# 请求超时/缓冲硬化：防慢速攻击 / header 炸弹
client_body_timeout 15s;
client_header_timeout 15s;
send_timeout 15s;
large_client_header_buffers 4 16k;

# 限流 key 取 XFF 第一个 IP：
#   公网隧道下 CF 边缘覆盖 XFF 为真实公网 IP → 每公网 IP 独立限流；
#   局域网直连时浏览器不传 XFF → 回退 $remote_addr。
#   不能用 $binary_remote_addr：Docker 端口转发下 remote_addr 恒为网关（172.19.0.1），
#   全站会共享一个桶、正常用户被误伤。
map $http_x_forwarded_for $client_ip {
    ""          $remote_addr;
    default     $http_x_forwarded_for;
    "~^([^,]+)" $1;            # 取 XFF 第一个
}

# 认证接口严格限流（登录/验证码）：防暴力破解/撞库
limit_req_zone $client_ip zone=auth:10m rate=1r/s;
# 其余 API 一般限流：防 CC/刷接口
limit_req_zone $client_ip zone=api:10m rate=15r/s;

server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:10m;

    include /etc/nginx/security-headers.conf;

    # 限流超限 → 429 → 统一 JSON（见 @rate_limited）
    limit_req_status 429;
    error_page 429 @rate_limited;

    # 限流 429 统一 JSON 响应（前端解包 code=42900 可正常提示）。
    # 注意：本块自定义 add_header 会遮蔽 server 级安全头，需重新 include。
    location @rate_limited {
        include /etc/nginx/security-headers.conf;
        default_type application/json;
        add_header Cache-Control "no-store";
        return 429 '{"code":42900,"message":"请求过于频繁，请稍后再试","data":null}';
    }

    # 聊天文件上传上限（与后端 100MB 保持一致）
    client_max_body_size 100m;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # 哈希静态资源：永久缓存 + 缺失即 404（不回退 index.html，避免旧包被误当 HTML 返回）
    location /assets/ {
        include /etc/nginx/security-headers.conf;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # index.html 永不缓存（强制每次重新验证），否则浏览器旧缓存会一直跑旧版应用
    # 注意：本块自定义 add_header 会遮蔽 server 级 include 的安全头，需重新 include
    # （nginx add_header 按块继承，同块内多条 add_header 均生效）。
    location = /index.html {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # SPA history 路由回退（排除上述精确匹配）
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 后端 API 反代
    # 认证接口严格限流（1r/s、突发 10）：防暴力破解/撞库。
    location = /api/v1/auth/login {
        limit_req zone=auth burst=10 nodelay;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }

    location = /api/v1/auth/captcha {
        limit_req zone=auth burst=10 nodelay;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }

    # AI 课程生成是长请求（后端 AI_COURSE_TIMEOUT_SECONDS=90s），单独精确匹配放宽容限，
    # 其余 /api/ 保持 60s 快速超时。
    location = /api/v1/training/manage/generate {
        limit_req zone=api burst=40 nodelay;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 180s;
    }

    location /api/ {
        limit_req zone=api burst=40 nodelay;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }

    # WebSocket（聊天实时推送）
    location /ws/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    # 健康检查
    location /health {
        proxy_pass http://backend:8000/health;
    }
}
