# 开发环境基础设施（数据层）：PostgreSQL / Redis / MinIO
# 用法：docker compose -f deploy/docker-compose.dev.yml up -d
# 后端本地 uvicorn 运行，前端 vite dev 运行（见 README）
services:
  postgres:
    image: postgres:16-alpine
    container_name: bt-postgres
    environment:
      POSTGRES_DB: blueteam
      POSTGRES_USER: blueteam
      POSTGRES_PASSWORD: blueteam_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U blueteam -d blueteam"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: bt-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  minio:
    image: minio/minio
    container_name: bt-minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data

volumes:
  postgres_data:
  redis_data:
  minio_data:
